name: GdUnit4 Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.5.1"

jobs:
  # Parallel test shards - split tests across multiple runners
  test:
    name: Tests (Shard ${{ matrix.shard }}/${{ matrix.total_shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total_shards: [4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Get test directories for shard
        id: shard
        run: |
          # Get all test directories
          TEST_DIRS=$(find scripts/tests/gdunit4 -name "test_*.gd" -type f | sort)
          TOTAL_FILES=$(echo "$TEST_DIRS" | wc -l)

          # Calculate shard boundaries
          SHARD=${{ matrix.shard }}
          TOTAL_SHARDS=${{ matrix.total_shards }}
          FILES_PER_SHARD=$(( (TOTAL_FILES + TOTAL_SHARDS - 1) / TOTAL_SHARDS ))
          START_LINE=$(( (SHARD - 1) * FILES_PER_SHARD + 1 ))
          END_LINE=$(( SHARD * FILES_PER_SHARD ))

          # Get this shard's files
          SHARD_FILES=$(echo "$TEST_DIRS" | sed -n "${START_LINE},${END_LINE}p" | tr '\n' ' ')
          echo "files=$SHARD_FILES" >> $GITHUB_OUTPUT
          echo "Shard $SHARD: Running tests from line $START_LINE to $END_LINE ($FILES_PER_SHARD files)"

      - name: Import Godot project
        run: |
          godot --headless --import 2>&1 | head -100 || true

      - name: Run GdUnit4 tests
        id: test
        continue-on-error: true
        run: |
          # Run tests for this shard with retry mechanism
          MAX_RETRIES=2
          RETRY_COUNT=0
          EXIT_CODE=1

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ $EXIT_CODE -ne 0 ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Test run attempt $RETRY_COUNT of $MAX_RETRIES"

            # Build GdUnit4 command with shard-specific files
            GDUNIT_CMD="godot --headless --path . -s addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -c"
            for file in ${{ steps.shard.outputs.files }}; do
              GDUNIT_CMD="$GDUNIT_CMD -a $file"
            done
            GDUNIT_CMD="$GDUNIT_CMD -rd reports/shard-${{ matrix.shard }}"

            $GDUNIT_CMD 2>&1 | tee test-output-${{ matrix.shard }}.log

            EXIT_CODE=${PIPESTATUS[0]}

            if [ $EXIT_CODE -ne 0 ] && [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Tests failed, retrying in 5 seconds..."
              sleep 5
            fi
          done

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: |
            reports/
            test-output-${{ matrix.shard }}.log
          retention-days: 7

      - name: Check test status
        run: |
          if [ "${{ steps.test.outputs.exit_code }}" != "0" ]; then
            echo "Tests failed with exit code ${{ steps.test.outputs.exit_code }}"
            exit 1
          fi

  # Aggregate results from all shards
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-shard-*
          merge-multiple: true

      - name: Generate summary report
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check each shard's results
          FAILED_SHARDS=""
          for i in 1 2 3 4; do
            if [ -f "test-output-$i.log" ]; then
              if grep -q "Exit code: 0" "test-output-$i.log"; then
                echo "- Shard $i: PASSED" >> $GITHUB_STEP_SUMMARY
              else
                echo "- Shard $i: FAILED" >> $GITHUB_STEP_SUMMARY
                FAILED_SHARDS="$FAILED_SHARDS $i"
              fi
            else
              echo "- Shard $i: NO RESULTS" >> $GITHUB_STEP_SUMMARY
              FAILED_SHARDS="$FAILED_SHARDS $i"
            fi
          done

          if [ -n "$FAILED_SHARDS" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Failed shards:$FAILED_SHARDS**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload combined report
        uses: actions/upload-artifact@v4
        with:
          name: test-results-combined
          path: reports/
          retention-days: 30
